# Partial host visibility. Use the native CLI for persistence and package checks.
services:
  cyber-posture:
    image: ${CYBER_IMAGE:-cyber-posture:local}
    build: .
    network_mode: host
    pid: host
    user: "${CYBER_DOCKER_USER:-10001:10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /run:rw,noexec,nosuid,nodev,mode=755
    volumes:
      - cyber-state:/var/lib/cyber-posture
      - ${HOME}/.config/cyber-posture:/etc/cyber-posture:ro
      - /etc:/host/etc:ro
      - /tmp:/host/tmp:ro
      - /var/tmp:/host/var/tmp:ro
      - /dev/shm:/host/dev/shm:ro
    environment:
      CYBER_PROFILE: ${CYBER_PROFILE:-default}
      CYBER_HUB_URL: ${CYBER_HUB_URL:-}
      CYBER_TZ: ${CYBER_TZ:-UTC}
      HOST_ROOT: /host
    command: [scan]
volumes:
  cyber-state:
