name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install profile parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Regression and syntax checks
        run: make test

      - name: CLI configuration smoke
        env:
          CYBER_STATE_DIR: ${{ runner.temp }}/cyber-state
          CYBER_REPORT_DIR: ${{ runner.temp }}/cyber-reports
          CYBER_CONFIG_DIR: ${{ runner.temp }}/cyber-config
        run: |
          ./bin/cyber-posture init-config
          ./bin/cyber-posture paths

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: cyber-posture:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke without host access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges cyber-posture:ci paths
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint python3 \
            cyber-posture:ci -c '
          import pathlib, subprocess
          state = pathlib.Path("/var/lib/cyber-posture")
          before = sorted(str(p) for p in state.rglob("*"))
          result = subprocess.run(["python3", "/opt/cyber-posture/bin/cyber-posture", "scan", "--no-write"], capture_output=True, text=True, timeout=90)
          assert result.returncode == 2, result.stderr
          assert "FIREWALL_UNVERIFIED" in result.stdout, result.stdout
          assert "HOST_INTEGRITY_OK" not in result.stdout
          assert before == sorted(str(p) for p in state.rglob("*"))
          print("Incomplete firewall coverage is explicit; --no-write preserved state.")
          '
