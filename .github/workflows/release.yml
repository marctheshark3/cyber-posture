name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1). Leave empty to build current SHA only."
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build · Push · GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            V="${{ inputs.tag }}"
            V="${V#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < VERSION)-sha.${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=cyber-posture
            org.opencontainers.image.description=Linux cyber exposure + host integrity scanner
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Build and push multi-arch
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate release notes
        id: notes
        if: github.ref_type == 'tag' || inputs.tag != ''
        run: |
          V="${{ steps.ver.outputs.version }}"
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          cat > /tmp/release-notes.md <<EOF
          ## cyber-posture v${V}

          Portable Linux **exposure + host integrity** scanner.

          ### Container images (GHCR)

          \`\`\`bash
          docker pull ${IMG}:v${V}
          docker pull ${IMG}:latest
          \`\`\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`

          ### Host scan (recommended)

          \`\`\`bash
          ./scripts/docker-run-host.sh scan
          ./scripts/docker-run-host.sh integrity --deep
          # or:
          docker run --rm --net=host --pid=host --user 0:0 \\
            -v cyber-state:/var/lib/cyber-posture \\
            -v \$HOME/.config/cyber-posture:/etc/cyber-posture \\
            -v /etc:/host/etc:ro \\
            -e HOST_ROOT=/host \\
            ${IMG}:v${V} scan
          \`\`\`

          ### Native install

          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git
          cd cyber-posture && git checkout v${V}
          ./install.sh
          cyber-posture scan
          \`\`\`

          ### Digest

          Image digest: \`${{ steps.build.outputs.digest }}\`
          EOF

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: /tmp/release-notes.md
          files: VERSION

  # Fast single-arch publish on main for continuous latest-dev
  publish-main:
    name: Publish main → :edge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
